name: Set up Flutter
description: >
  Installs the one Flutter version this repository pins, read from
  `.flutter-version` at the repo root. Every workflow that needs Flutter goes
  through here so the version cannot drift between them — and so a developer
  can read the same file to match CI, which matters because the golden tests
  compare rasterised images and different Flutter versions rasterise the same
  drawing slightly differently.

outputs:
  version:
    description: The Flutter version that was installed.
    value: ${{ steps.read-version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read pinned Flutter version
      id: read-version
      shell: bash
      run: |
        file="$GITHUB_WORKSPACE/.flutter-version"
        if [ ! -f "$file" ]; then
          echo "::error::$file is missing — the pinned Flutter version lives there."
          exit 1
        fi
        version="$(tr -d '[:space:]' < "$file")"
        if [ -z "$version" ]; then
          echo "::error::$file is empty — it must contain exactly one Flutter version."
          exit 1
        fi
        echo "Flutter $version (pinned in .flutter-version)"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Retried once, same shape as .github/actions/docker-build-push. This step
    # downloads and unpacks the SDK, and that download dies often enough to
    # matter: `centroidx-upgrader-test (macos-latest)` lost a run on PR #463
    # when it exited 56 (curl "recv failure") 152s in, taking the whole job
    # with it before a single test had run. Nothing about the repository is
    # involved in that failure and nothing about it is reproducible, so the
    # only sane response is to fetch it again.
    #
    # No signature check here, unlike the pub-get action: flutter-action either
    # produces a usable SDK or it does not, and a second attempt costs ~80s
    # against a job that is otherwise wholly lost.
    - name: Install Flutter
      id: first-attempt
      uses: subosito/flutter-action@v2
      continue-on-error: true
      with:
        flutter-version: ${{ steps.read-version.outputs.version }}

    - name: Note the retry
      if: steps.first-attempt.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Installing Flutter ${{ steps.read-version.outputs.version }} failed on the first attempt — retrying once. This is the SDK download, not anything in this repository."

    - name: Install Flutter (retry)
      if: steps.first-attempt.outcome == 'failure'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.read-version.outputs.version }}

    # Confirm the Flutter that ended up on PATH is the pinned one. Belt and
    # braces against the installer resolving the request to something else —
    # a cached SDK from another run, a version spec that matched loosely — and
    # more importantly, this is the same script developers run locally
    # (`scripts/check-flutter-version.sh`), so CI exercises it on every run and
    # it cannot quietly rot into always passing.
    - name: Verify the installed Flutter matches the pin
      shell: bash
      run: bash scripts/check-flutter-version.sh
