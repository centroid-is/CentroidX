name: Main Prerelease

# Rebuilds the desktop apps on every push to main and republishes them under a
# single rolling prerelease tag, so the README can link to stable URLs that
# always serve the tip of main. Unlike Actions artifacts these need no GitHub
# login to download and never expire.
#
# The tag is `main-latest`, not `main` — a tag sharing a name with a branch
# makes every `git <cmd> main` ambiguous, and tag.yml would treat it as a
# version tag (it explicitly ignores this one).

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: main-prerelease
  cancel-in-progress: true

jobs:
  windows-build:
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos-build:
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  linux-build:
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  # The manager is only otherwise published on a tagged release, so the README
  # served a manager as old as the last tag. Building it here keeps the
  # download current with main — and a manager predating a fix cannot install
  # anything, which is exactly how the Windows asset-name bug stayed invisible.
  #
  # Build only: `publish` needs this job, and `needs` on a reusable workflow is
  # all-or-nothing — every job inside it must pass. Its integration tests
  # download from whatever release is currently newest, which is the one this
  # run is about to delete and recreate. Gating the publish on them means a
  # broken main-latest keeps main-latest broken; that deadlocked releases from
  # #243 until #271. They still run on PRs and on pushes to the manager.
  manager-build:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
    with:
      run_integration_tests: 'false'

  # The USB installer for the OS under the containers, built from this same
  # commit. It is ~1.3GB and takes ~12 minutes, but it runs beside the three app
  # builds rather than after them, so it costs the run no wall-clock.
  #
  # Deliberately NOT a hard dependency of `publish` -- see the `if` there. A
  # debos or apt failure must not be able to hold the app prerelease hostage;
  # that is the mistake that deadlocked releases from #243 until #271.
  station-image:
    uses: ./.github/workflows/station-image.yml
    secrets: inherit

  publish:
    needs: [windows-build, macos-build, linux-build, manager-build, station-image]
    # `!cancelled()` plus an explicit roll-call of the jobs that are genuinely
    # required. station-image is in `needs` only to be waited for -- its result
    # is not consulted, so a failed image publishes an app prerelease without
    # one instead of publishing nothing at all.
    if: >-
      !cancelled()
      && needs.windows-build.result == 'success'
      && needs.macos-build.result == 'success'
      && needs.linux-build.result == 'success'
      && needs.manager-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows portable build
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-windows-portable
          path: centroidx-windows-x64/

      # The MSIX is what centroidx-manager installs on Windows — without it
      # the "latest" update channel has nothing installable here.
      - name: Download Windows MSIX
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi.msix
          path: msix/

      # Without this the MSIX above is unusable on any machine that has not
      # already trusted the sideload certificate by hand — see windows.yml for
      # why it is exported and why publishing it is safe.
      - name: Download sideload certificate
        uses: actions/download-artifact@v4
        with:
          name: centroidx-sideload.cer
          path: release/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: centroidx_darwin_arm64.dmg
          path: release/

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: centroidx_linux_x64.tar.gz
          path: release/

      # Manager binaries for all three platforms, named as the README links
      # expect them.
      - name: Download manager binaries
        uses: actions/download-artifact@v4
        with:
          pattern: centroidx-manager_*
          path: manager/
          merge-multiple: true

      # continue-on-error because station-image is allowed to have failed: with
      # no artifact this step goes red, the asset is left out, and the release
      # still publishes. Checked by name below rather than trusted.
      - name: Download station USB installer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: station-usb-installer
          path: release/


      # upload-artifact roots an artifact at the least common ancestor of its
      # upload paths, which for os/out/usb-installer.* puts both files at the
      # artifact root -- so they should already be at release/. That is an
      # implicit consequence of those paths rather than a guarantee, and the only
      # symptom of being wrong is a release quietly missing its installer. So it
      # is normalised instead of assumed, and the release publishes either way.
      - name: Put the installer where the asset list expects it
        run: |
          set -euo pipefail
          cd release
          for f in usb-installer.img.gz usb-installer.img.bmap; do
            [ -f "$f" ] && continue
            found=$(find . -name "$f" -type f -print -quit)
            if [ -n "$found" ]; then
              echo "::warning::$f was at $found, not the artifact root - moving it"
              mv "$found" "$f"
            fi
          done
          ls -l usb-installer.* 2>/dev/null || echo "no station installer in this run"

      # GitHub refuses any release asset of 2 GiB or more -- the upload answers
      # "HTTP 422: Validation Failed ... size must be less than 2147483648" and
      # takes the whole `gh release create` down with it, so the release is left
      # deleted and not recreated. Since #526 turned `preload` on, the installer
      # carries ~1.9GB of container images and lands at ~2.7GB, which is how
      # every prerelease since has failed.
      #
      # Conditional, not unconditional: a non-preloaded image is ~1.0GB and is
      # better published as the one file people expect. Parts are only ever
      # produced for an image that could not be published at all.
      - name: Split the installer past GitHub's asset limit
        run: |
          set -euo pipefail
          cd release
          [ -f usb-installer.img.gz ] || exit 0

          limit=2147483648
          size=$(stat -c %s usb-installer.img.gz)
          if [ "$size" -lt "$limit" ]; then
            echo "installer is $size bytes, inside the ${limit}-byte limit - publishing whole"
            exit 0
          fi

          # 800MB per part, not the 1.8e9 that merely fits GitHub's 2GiB cap:
          # a part that size is accepted in principle and not in practice --
          # every attempt in run 35257514051 died with "HTTP 500: Error saving
          # asset" on a 1.7GB part00. Smaller requests land, and retrying one
          # costs a minute instead of twenty. -d -a 2 names them .part00,
          # .part01, ... which sort in `cat`'s glob order -- the reassembly
          # instruction in the release notes depends on that.
          echo "installer is $size bytes, past the ${limit}-byte limit - splitting"
          split -b 800000000 -d -a 2 usb-installer.img.gz usb-installer.img.gz.part
          rm -f usb-installer.img.gz
          ls -l usb-installer.img.gz.part*

      - name: Assemble release assets
        run: |
          set -euo pipefail

          # Zipped with a top-level directory so it does not explode into the
          # user's Downloads folder. Contents are the portable Release folder:
          # centroidx.exe plus the Flutter and VC++ runtime DLLs and data/.
          zip -qr release/centroidx_windows_x64.zip centroidx-windows-x64

          # Canonical asset name the manager looks for (msix:create emits
          # centroidx.msix). Renamed before checksumming so the checksum line
          # matches the published filename.
          mv msix/*.msix release/centroidx_windows_amd64.msix

          mv manager/centroidx-manager_* release/
          ls -lh manager/ 2>/dev/null || true

          cd release

          # Named, never globbed -- if a build stops producing one of these the
          # checksum step fails rather than quietly publishing without it.
          sums=( centroidx_windows_x64.zip centroidx_windows_amd64.msix
                 centroidx-sideload.cer
                 centroidx_darwin_arm64.dmg
                 centroidx_linux_x64.tar.gz )
          sums+=( centroidx-manager_* )

          # The station installer is the one asset allowed to be missing, so it
          # is tested for instead. Both halves or neither: bmaptool needs the
          # .bmap to flash the sparse image, and a .bmap without its image is
          # just confusing.
          #
          # Globbed over both shapes because the step above may have replaced
          # the single file with .part00/.part01. The checksums name whichever
          # files are actually published, so what a downloader verifies is what
          # they downloaded, before any reassembly.
          #
          # Collected by existence rather than by `nullglob`, which does not
          # help here: it only drops a pattern that HAS glob metacharacters and
          # matches nothing, so the literal `usb-installer.img.gz` survives in
          # the array after the split step deleted it, and the release then
          # fails on an asset that is not there.
          station=()
          for f in usb-installer.img.gz usb-installer.img.gz.part*; do
            [ -f "$f" ] || continue
            station+=( "$f" )
          done
          if [ "${#station[@]}" -gt 0 ] && [ -f usb-installer.img.bmap ]; then
            sums+=( "${station[@]}" usb-installer.img.bmap )
            echo "station installer present: ${station[*]}"
          else
            echo "::warning::no station USB installer in this run - publishing without it"
            rm -f usb-installer.img.gz usb-installer.img.gz.part* usb-installer.img.bmap
          fi

          sha256sum "${sums[@]}" > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      # Recreated rather than edited: gh cannot move an existing tag, and a
      # stale tag would leave the release pointing at the wrong commit.
      - name: Republish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The release is deleted and recreated on every run, so an asset
          # cannot simply be left in place between runs -- everything published
          # has to be passed to `create` below. That is why station-image is
          # built here rather than uploaded to main-latest out of band.
          assets=( release/centroidx_windows_x64.zip
                   release/centroidx_windows_amd64.msix
                   release/centroidx-sideload.cer
                   release/centroidx_darwin_arm64.dmg
                   release/centroidx_linux_x64.tar.gz
                   release/centroidx-manager_windows_amd64.exe
                   release/centroidx-manager_darwin_arm64.dmg
                   release/centroidx-manager_linux_amd64
                   release/SHA256SUMS.txt )

          STATION_ROW=''
          station=()
          for f in release/usb-installer.img.gz release/usb-installer.img.gz.part*; do
            [ -f "$f" ] || continue
            station+=( "$f" )
          done
          if [ "${#station[@]}" -gt 0 ]; then
            assets+=( "${station[@]}" release/usb-installer.img.bmap )
            if [ -f release/usb-installer.img.gz ]; then
              STATION_ROW='| Station OS (x64) | `usb-installer.img.gz` — write to a USB key and boot it to install Debian + the container stack on a station; `.bmap` is for `bmaptool` |'
            else
              STATION_ROW='| Station OS (x64) | `usb-installer.img.gz.part00`, `.part01`, … — GitHub caps one asset at 2 GiB, so download **every** part and rejoin them first: `cat usb-installer.img.gz.part* > usb-installer.img.gz`. Then write that to a USB key and boot it to install Debian + the container stack on a station; `.bmap` is for `bmaptool` |'
            fi
          fi

          notes_template="Automatically built from the tip of \`main\` (\`${GITHUB_SHA:0:7}\`).

          These are development builds, not a release — they have had no release testing and are replaced on every merge to \`main\`. For production use the [latest release](https://github.com/${GITHUB_REPOSITORY}/releases/latest).

          | Platform | Asset |
          |----------|-------|
          | macOS (Apple Silicon) | \`centroidx_darwin_arm64.dmg\` — Developer ID signed; notarized only when Apple's notary service accepts the build |
          | Windows (x64) | \`centroidx_windows_x64.zip\` — portable exe + libs, no installer |
          | Windows (x64) | \`centroidx_windows_amd64.msix\` — sideload installer, used by the in-app updater's latest channel |
          | Windows (x64) | \`centroidx-sideload.cer\` — public signing certificate; the MSIX will not install until this is in \`LocalMachine\\TrustedPeople\` |
          | Linux (x64) | \`centroidx_linux_x64.tar.gz\` — GTK3 desktop bundle |
          __STATION_ROW__

          The \`centroidx-manager_*\` assets are the version manager built from this same commit; its **Latest** channel installs the packages above.

          Checksums in \`SHA256SUMS.txt\`."

          # The station row is only in the notes once every station asset is
          # actually up: the row tells the reader to `cat` the parts together,
          # and doing that to a partial set silently yields a corrupt image.
          notes="${notes_template//__STATION_ROW__/}"
          notes_with_station="${notes_template//__STATION_ROW__/$STATION_ROW}"

          # Assets are uploaded one at a time rather than passed to `create`,
          # which sends them as a single all-or-nothing act. The station image
          # is ~3GB and GitHub's upload endpoint does fail on it; such a
          # failure used to discard the assets that had already landed and
          # start the whole upload over. Run 35257514051 spent 75 minutes
          # doing that three times and published nothing at all.
          #
          # So the release is created empty first -- the README's download
          # links resolve seconds after the delete, whatever becomes of the
          # uploads -- and every asset then retries on its own.
          upload() {
            local f=$1 attempt
            for attempt in 1 2 3; do
              # --clobber because an upload can fail after the asset was in
              # fact saved; without it the retry is refused as a duplicate
              # ("HTTP 422: Validation Failed"), which is how the manual rerun
              # of run 35246924477 died.
              if gh release upload main-latest --repo "$GITHUB_REPOSITORY" --clobber "$f"; then
                return 0
              fi
              echo "::warning::upload of $f failed (attempt $attempt of 3)"
              [ "$attempt" -lt 3 ] && sleep $(( attempt * 30 ))
            done
            return 1
          }

          gh release delete main-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create main-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "$notes"

          # Smallest first, so a slow giant at the end cannot hold up the app
          # downloads -- the ones anybody actually clicks.
          failed=()
          while read -r f; do
            upload "$f" || failed+=( "$f" )
          done < <(ls -rS "${assets[@]}")

          if [ "${#station[@]}" -gt 0 ]; then
            station_failed=0
            for f in ${failed[@]+"${failed[@]}"}; do
              case "$f" in release/usb-installer.*) station_failed=1 ;; esac
            done
            if [ "$station_failed" -eq 0 ]; then
              gh release edit main-latest --repo "$GITHUB_REPOSITORY" --notes "$notes_with_station"
            else
              # Unannounced parts would still be sitting there for someone to
              # find and rejoin, so they go.
              echo "::warning::station installer incomplete - removing its parts from the release"
              for f in "${station[@]}" release/usb-installer.img.bmap; do
                gh release delete-asset main-latest "$(basename "$f")" \
                  --repo "$GITHUB_REPOSITORY" --yes || true
              done
            fi
          fi

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed to upload: ${failed[*]} - the rest of main-latest is published"
            exit 1
          fi
