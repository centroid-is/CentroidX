name: macOS Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
  # No push trigger for main — main-prerelease.yml calls this workflow so the
  # build happens once and its artifacts get published.
  push:
    branches:
      - 'feat/centroidx-manager'
    paths:
      - 'centroid-hmi/**'
      - '.github/workflows/macos.yml'
  # Unfiltered: every PR must prove it does not break the desktop build that
  # main-prerelease.yml publishes.
  pull_request:

permissions:
  contents: write
  packages: write

# Without this, every push to a PR stacked another full run instead of
# superseding the one it replaced — the main source of macOS runner starvation
# on GitHub Free (5 concurrent macOS jobs).
#
# The group is namespaced by this workflow file rather than by
# `github.workflow` alone. A called workflow does not get its own run: its jobs
# join the caller's run and the whole `github` context is the caller's. So
# main-prerelease.yml (which calls macos, linux and windows) and tag.yml (which
# calls macos, windows, centroid-hmi and build-manager) would hand every callee
# in the run the identical group `Main Prerelease-<ref>` / `Tag Release-<ref>`,
# and the callees would queue behind — or cancel — each other. The `macos-`
# prefix is what keeps them apart.
#
# Keeping a release build from being cancelled is done in the group, not in
# `cancel-in-progress`. The earlier form relied on
# `cancel-in-progress: ${{ github.event_name == 'pull_request' }}` being false
# for main-prerelease's push and tag.yml's tag push; measured on 2026-08-22 it
# cancelled them anyway (see test.yml for the numbers). Appending `run_id` for
# every non-PR event puts each release build in a group of its own, so there is
# nothing that could cancel it regardless of how the expression is coerced.
#
# The context here is still the caller's, so `github.run_id` is the caller's
# run — shared by macos, linux and windows within one main-prerelease run, and
# kept apart by the `macos-` prefix above.
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  # The job id stays `build` — main-prerelease.yml and tag.yml call this
  # workflow — but the `name` is what becomes the status check context, and
  # three workflows all publishing a check called `build` made it impossible
  # to require this one specifically in branch protection.
  build:
    name: macOS Build
    runs-on: macos-latest
    steps:
      # `actions/checkout` is a network operation against github.com, and it fails
      # outright often enough to matter — 9 times in the 2.5 weeks to 2026-09-10,
      # each one killing a whole job before a single useful step had run. Retried
      # once here, and at every other checkout in this file.
      #
      # This cannot be factored into `.github/actions/` the way pub-get and
      # setup-flutter are: a local composite action is loaded from the workspace,
      # and the workspace does not exist until checkout has run. So the retry is
      # written out at each site instead.
      #
      # Safe to repeat: checkout cleans the workspace on entry, so the second
      # attempt does not inherit a half-finished first one.
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve build sha
        shell: bash
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ]; then
            echo "No signing certificate configured — skipping"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "Signing identity: $IDENTITY"

      - name: Disable Xcode signing (will re-sign manually after build)
        working-directory: centroid-hmi/macos
        run: |
          # Disable all code signing in Xcode — we re-sign with Developer ID after build
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "-"/CODE_SIGN_IDENTITY = ""/g' Runner.xcodeproj/project.pbxproj
          sed -i '' '/DEVELOPMENT_TEAM/d' Runner.xcodeproj/project.pbxproj
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' Runner.xcodeproj/project.pbxproj
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' Runner.xcodeproj/project.pbxproj

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Get Flutter packages
        uses: ./.github/actions/pub-get
        with:
          working-directory: centroid-hmi

      - name: Inject no-signing xcconfig
        working-directory: centroid-hmi/macos
        run: |
          # Create an xcconfig that disables signing; include it in Release config
          echo 'CODE_SIGN_IDENTITY =' > NoSign.xcconfig
          echo 'CODE_SIGNING_REQUIRED = NO' >> NoSign.xcconfig
          echo 'CODE_SIGNING_ALLOWED = NO' >> NoSign.xcconfig
          # Append include to the Flutter-generated Release xcconfig
          echo '#include "NoSign.xcconfig"' >> Flutter/Release.xcconfig

      - name: Build macOS release (unsigned — re-signed after build)
        working-directory: centroid-hmi
        # CENTROIDX_CHAT/CENTROIDX_KNOWLEDGE off: shipped binaries exclude the AI chat and
        # knowledge features for now (lib/core/feature_flags.dart).
        run: flutter build macos --release --dart-define=GIT_SHA=${{ env.BUILD_SHA }} --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false

      - name: Re-sign with hardened runtime for notarization
        if: env.CODESIGN_IDENTITY != ''
        working-directory: centroid-hmi
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "Re-signing with hardened runtime: $APP_PATH"

          # Sign all nested code first (frameworks, dylibs, helpers)
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.framework" -o -perm +111 \) -not -path "*/Headers/*" -not -name "*.h" | while read -r item; do
            codesign --force --options runtime --sign "$CODESIGN_IDENTITY" --timestamp "$item" 2>/dev/null || true
          done

          # Sign framework bundles
          find "$APP_PATH" -name "*.framework" -type d | while read -r fw; do
            codesign --force --options runtime --sign "$CODESIGN_IDENTITY" --timestamp "$fw"
          done

          # Expand $(AppIdentifierPrefix) in entitlements — Xcode does this
          # automatically but manual signing does not
          TEAM_ID="${APPLE_TEAM_ID:-Q4FZLRTZ4M}"
          sed "s/\$(AppIdentifierPrefix)/${TEAM_ID}./" macos/Runner/Release.entitlements > /tmp/release.entitlements

          # Sign the main app bundle
          codesign --force --options runtime --sign "$CODESIGN_IDENTITY" --timestamp \
            --entitlements /tmp/release.entitlements "$APP_PATH"

          codesign --verify --deep --strict "$APP_PATH"
          echo "APP_PATH=$(pwd)/$APP_PATH" >> $GITHUB_ENV
          echo "Signing verified"

      - name: Set APP_PATH for unsigned builds
        if: env.CODESIGN_IDENTITY == ''
        working-directory: centroid-hmi
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "APP_PATH=$(pwd)/$APP_PATH" >> $GITHUB_ENV

      - name: Create DMG
        run: |
          DMG_NAME="centroidx_darwin_arm64.dmg"
          DMG_DIR=$RUNNER_TEMP/dmg-contents
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/CentroidX.app"
          ln -s /Applications "$DMG_DIR/Applications"

          # Retries "Resource busy", which `hdiutil create` throws
          # intermittently and which would otherwise cost a whole release —
          # this job is in create-release's `needs`. See the script.
          "$GITHUB_WORKSPACE/.github/scripts/create-dmg.sh" \
            "CentroidX" "$DMG_DIR" "$DMG_NAME"

          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Sign the DMG
        if: env.CODESIGN_IDENTITY != ''
        run: |
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp "$DMG_NAME"
          codesign --verify --strict "$DMG_NAME"
          echo "DMG signed"

      # Non-fatal: notarization depends on Apple's service and on the team's
      # licence agreements being current, neither of which a code change can
      # break, so it must not fail the build. The DMG is still Developer ID
      # signed — it just is not stapled, and macOS shows a Gatekeeper prompt on
      # first launch. Failure raises a warning annotation on the run summary;
      # do not ship a release built from an orange run without checking it.
      - name: Notarize the DMG
        if: env.CODESIGN_IDENTITY != ''
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if ! xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait; then
            echo "::warning title=Notarization failed::$DMG_NAME is signed but NOT notarized or stapled. macOS will warn on first launch. Check the Apple Developer team's agreements and the notary service status."
            exit 1
          fi
          echo "Notarization complete"

          xcrun stapler staple "$DMG_NAME"
          echo "Stapled notarization ticket"

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: centroidx_darwin_arm64.dmg
          path: ${{ env.DMG_NAME }}
