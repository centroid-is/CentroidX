name: Station image

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      compose_ref:
        description: CentroidX ref to bake docker-compose.yml from
        default: main
      preload:
        description: Bake the container images into the image
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and runs anywhere: catches template errors, missing scripts, bad
  # action properties. Everything below needs KVM, so fail fast here first.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/w" -w /w koalaman/shellcheck:stable \
            scripts/*.sh \
            overlays/base/usr/local/bin/centroidx-firstboot \
            overlays/installer/usr/local/bin/centroidx-install \
            overlays/installer/usr/local/bin/centroidx-install-failsafe
      - name: verify archive keys
        run: make verify-keys
      - name: debos --dry-run on every recipe
        run: make dry-run

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's hosted Ubuntu runners expose /dev/kvm, but it is owned by the
      # kvm group and not world-writable, so a container started as the runner
      # user cannot open it. This is the standard fix.
      - name: Make /dev/kvm usable
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is absent on this runner - debos cannot build an image"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bmap-tools zstd

      - name: Free up disk
        run: |
          # An 8GB image plus a 16GB USB image plus scratch does not fit
          # alongside the runner's preinstalled toolchains.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build station image
        run: |
          make image \
            COMPOSE_REF=${{ inputs.compose_ref || 'main' }} \
            PRELOAD=${{ inputs.preload || 'false' }} \
            DOCKER_TTY=

      - name: Build installer USB
        run: make usb DOCKER_TTY=

      - name: Checksums
        run: |
          cd out && sha256sum *.img.gz *.bmap usb-installer.img | tee SHA256SUMS
          cat ../overlays/generated/etc/centroid/image-info

      - uses: actions/upload-artifact@v4
        with:
          name: centroidx-station-image
          path: |
            out/*.img.gz
            out/*.bmap
            out/SHA256SUMS
            overlays/generated/etc/centroid/image-info
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: centroidx-usb-installer
          path: out/usb-installer.img
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release' && github.event.action == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            out/*.img.gz out/*.bmap out/SHA256SUMS out/usb-installer.img \
            --clobber
