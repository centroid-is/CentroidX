name: Linux Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
  # Unfiltered: every PR must prove it does not break the desktop build that
  # main-prerelease.yml publishes.
  pull_request:

permissions:
  contents: read

# `linux-` prefix, and the expression rather than bare `true`, for the reasons
# spelled out in macos.yml: main-prerelease.yml calls this workflow alongside
# macos and windows in a single run, where the github context is the caller's.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job id stays `build` (main-prerelease.yml calls this workflow); `name` is
  # what the status check context is called. See macos.yml.
  build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve build sha
        shell: bash
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # GTK for the desktop shell, libsecret/jsoncpp for
      # flutter_secure_storage_linux, liblzma for the Flutter toolchain,
      # libmpv for media_kit (RTSP camera asset) — the bundle does not ship
      # libmpv, so the target machine needs the distro's libmpv/mpv package
      # for camera playback (everything else runs without it).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libmpv-dev

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Get Flutter packages
        uses: ./.github/actions/pub-get
        with:
          working-directory: centroid-hmi

      - name: Build Linux
        working-directory: centroid-hmi
        # CENTROIDX_CHAT/CENTROIDX_KNOWLEDGE off: shipped binaries exclude the AI chat and
        # knowledge features for now (lib/core/feature_flags.dart).
        run: flutter build linux --release --dart-define=GIT_SHA=${{ env.BUILD_SHA }} --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false

      # The bundle is already relocatable — the runner has an $ORIGIN/lib
      # rpath — so a plain tarball of the directory runs anywhere with GTK3.
      - name: Package portable bundle
        working-directory: centroid-hmi/build/linux/x64/release
        run: |
          mv bundle centroidx-linux-x64
          tar -czf "$GITHUB_WORKSPACE/centroidx_linux_x64.tar.gz" centroidx-linux-x64
          ls -lh "$GITHUB_WORKSPACE/centroidx_linux_x64.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: centroidx_linux_x64.tar.gz
          path: centroidx_linux_x64.tar.gz
