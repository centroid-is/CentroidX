name: Build and Push centroid-hmi Docker Image (ivi-homescreen)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build in release mode'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
      release:
        description: 'Build in release mode'
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

# Two runs of this workflow on the same PR branch push the same `pr-NNN` tag,
# so let a new push replace the one in flight rather than race it. Only for
# pull requests — a main or tag build must finish and publish.
#
# `ivi-` prefix for consistency with the other workflow_call targets. This one
# has no caller today, so the prefix changes nothing now; it keeps the group
# unique if a caller is ever added. See macos.yml. The cancel guard is #235's,
# unchanged.
concurrency:
  group: ivi-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  # Same job ids as centroid-hmi.yml — see the note there. `name` keeps the two
  # workflows' checks apart; the ids are unchanged.
  docker-build:
    name: Docker Image (ivi-homescreen)
    runs-on: ubuntu-latest
    outputs:
      centroid_hmi_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      # `actions/checkout` is a network operation against github.com, and it fails
      # outright often enough to matter — 9 times in the 2.5 weeks to 2026-09-10,
      # each one killing a whole job before a single useful step had run. Retried
      # once here, and at every other checkout in this file.
      #
      # This cannot be factored into `.github/actions/` the way pub-get and
      # setup-flutter are: a local composite action is loaded from the workspace,
      # and the workspace does not exist until checkout has run. So the retry is
      # written out at each site instead.
      #
      # Safe to repeat: checkout cleans the workspace on entry, so the second
      # attempt does not inherit a half-finished first one.
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/frontend-ivi/Dockerfile.build
          build-args: |
            BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:latest

      - name: Build and push Docker image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/frontend-ivi/Dockerfile.build
          build-args: |
            BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:stable

      - name: Build and push Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/frontend-ivi/Dockerfile.build
          build-args: |
            BUILD_MODE=release
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi-ivi:pr-${{ github.event.pull_request.number }}

  backend-build:
    name: Backend Image (ivi-homescreen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-backend:latest

      - name: Build and push backend Docker image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-backend:stable

      - name: Build and push backend Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:pr-${{ github.event.pull_request.number }}
