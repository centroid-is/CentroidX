name: Windows MSIX Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
      release:
        description: 'Create a GitHub release with the MSIX'
        type: boolean
        default: false
  # No push trigger for main — main-prerelease.yml calls this workflow so the
  # build happens once and its artifacts get published.
  pull_request:

permissions:
  contents: write
  packages: write

# `windows-` prefix, and the expression rather than bare `true`, for the
# reasons spelled out in macos.yml: main-prerelease.yml and tag.yml each call
# this workflow alongside others in a single run, where the github context is
# the caller's.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job id stays `build` (main-prerelease.yml and tag.yml call this workflow);
  # `name` is what the status check context is called. See macos.yml.
  build:
    name: Windows MSIX Build
    runs-on: windows-latest
    steps:
      # `actions/checkout` is a network operation against github.com, and it fails
      # outright often enough to matter — 9 times in the 2.5 weeks to 2026-09-10,
      # each one killing a whole job before a single useful step had run. Retried
      # once here, and at every other checkout in this file.
      #
      # This cannot be factored into `.github/actions/` the way pub-get and
      # setup-flutter are: a local composite action is loaded from the workspace,
      # and the workspace does not exist until checkout has run. So the retry is
      # written out at each site instead.
      #
      # Safe to repeat: checkout cleans the workspace on entry, so the second
      # attempt does not inherit a half-finished first one.
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve build sha
        shell: bash
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The module cache key is built from go.sum, and setup-go looks
          # for it at the repo root by default — where this repo does not have
          # one. Without this the cache never restores ("Dependencies file is
          # not found"), so every run re-downloads every module from
          # proxy.golang.org. That is slower, and it is a network round trip
          # per module on which the build can and does fail: a `stream error
          # ... INTERNAL_ERROR received from peer` fetching go-text/typesetting
          # is what broke Main Prerelease on 2026-09-02.
          cache-dependency-path: tools/centroidx-manager/go.sum

      - name: Embed Windows icon resource
        working-directory: tools/centroidx-manager
        shell: bash
        run: windres --use-temp-file -o centroidx.syso centroidx.rc

      - name: Build centroidx-manager for Windows
        working-directory: tools/centroidx-manager
        run: go build -o centroidx-manager_windows_amd64.exe .

      # The manager asks stations for elevation, and an unsigned exe makes
      # that prompt say "Unknown publisher". Signed with the same certificate
      # as the MSIX and timestamped, so the signature keeps verifying after
      # the certificate itself expires. This runs BEFORE the bundle step so
      # the copy every station extracts from the app's assets is the signed
      # one.
      - name: Sign centroidx-manager with the sideload certificate
        working-directory: tools/centroidx-manager
        shell: powershell
        env:
          MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found under Windows Kits" }
          & $signtool.FullName sign /f $pfx /p $env:MSIX_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            centroidx-manager_windows_amd64.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign exited $LASTEXITCODE" }
          Remove-Item $pfx
          # Positive evidence, not a swallowed chain error: signtool verify
          # would fail here by design (the runner has not trusted our root),
          # so assert the three things that must be true regardless of trust:
          # a signature exists, it was made by OUR subject, and it carries a
          # timestamp so it outlives the certificate's expiry.
          $sig = Get-AuthenticodeSignature centroidx-manager_windows_amd64.exe
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
            throw "manager exe is not signed"
          }
          $subject = "CN=Centroid, O=Centroid ehf., C=IS"
          if ($sig.SignerCertificate.Subject -ne $subject) {
            throw "signed by '$($sig.SignerCertificate.Subject)', expected '$subject'"
          }
          if (-not $sig.TimeStamperCertificate) {
            throw "signature carries no timestamp - it would stop verifying when the certificate expires"
          }
          Write-Host "Signed by $subject, timestamped, status: $($sig.Status)"

      - name: Bundle manager binary into Flutter assets
        shell: bash
        run: |
          mkdir -p centroid-hmi/assets/manager
          cp tools/centroidx-manager/centroidx-manager_windows_amd64.exe \
             centroid-hmi/assets/manager/centroidx-manager_windows_amd64.exe
          ls -la centroid-hmi/assets/manager/

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Get Flutter packages
        uses: ./.github/actions/pub-get
        with:
          working-directory: centroid-hmi

      - name: Build Windows
        working-directory: centroid-hmi
        # CENTROIDX_CHAT/CENTROIDX_KNOWLEDGE off: shipped binaries exclude the AI chat and
        # knowledge features for now (lib/core/feature_flags.dart).
        run: flutter build windows --release --dart-define=GIT_SHA=${{ env.BUILD_SHA }} --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false

      - name: Write certificate PFX from secret
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.MSIX_CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}/centroid-hmi/centroidx-sideload.pfx", $bytes)

      # The MSIX is signed by a self-signed sideload certificate, so Windows
      # refuses to install it until that certificate is in the machine's
      # TrustedPeople store. centroidx-manager already knows how to do that —
      # downloadCertAsset() looks for a .cer or .crt among the release assets
      # and hands it to TrustCertificate — but no workflow has ever published
      # one, so the lookup always came back empty and the install hit
      # 0x800B0109 with nothing in the log to say why.
      #
      # Extracted from the PFX rather than by running scripts/generate-cert.ps1:
      # that script is documented "Do NOT run this in CI" because it calls
      # New-SelfSignedCertificate, which would mint a *different* certificate
      # from the one the package was just signed with — publishing that would
      # be worse than publishing nothing, since trusting it changes nothing and
      # looks like it should. Its output filename is reused verbatim.
      #
      # PowerShell rather than openssl: Export-Certificate is the exact inverse
      # of the Export-PfxCertificate that produced the secret, and it does not
      # care how the PFX was encrypted. OpenSSL 3 needs -legacy for PFXs
      # written by older Windows tooling, which is a portability trap for a
      # step that must not break silently.
      - name: Export the public sideload certificate
        working-directory: centroid-hmi
        shell: powershell
        # ASCII only below this line. Windows PowerShell 5.1 reads the script
        # GitHub writes for it as ANSI, not UTF-8, so a non-ASCII character in
        # a string literal arrives as mojibake and can terminate the token
        # early: an em-dash here failed the build with
        # "ParserError: UnexpectedToken". Inside a # comment it is harmless,
        # which is why the em-dash further down this file has never bitten.
        run: |
          $ErrorActionPreference = "Stop"
          $password = ConvertTo-SecureString "${{ secrets.MSIX_CERT_PASSWORD }}" -AsPlainText -Force
          $signing = (Get-PfxData -FilePath "centroidx-sideload.pfx" -Password $password).EndEntityCertificates[0]
          Export-Certificate -Cert $signing -FilePath "centroidx-sideload.cer" -Type CERT | Out-Null

          # Read back what was actually written, not what we think we wrote.
          # This asset is published to the world, so the two things that must
          # be true about it are checked against the file itself.
          $exported = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 `
            ((Resolve-Path "centroidx-sideload.cer").Path)

          # A DER certificate cannot physically carry a private key, but this
          # is the assertion anyone reviewing "we publish our signing cert"
          # will look for.
          if ($exported.HasPrivateKey) {
            throw "Exported certificate carries a private key - refusing to publish it"
          }

          # Trusting the wrong certificate is indistinguishable from trusting
          # none. pubspec.yaml anchors the package identity to this subject.
          # A name, no longer a GUID: it is what Windows reads out on every
          # approval prompt, and it must equal the certificate subject byte
          # for byte.
          $expected = "CN=Centroid, O=Centroid ehf., C=IS"
          if ($exported.Subject -ne $expected) {
            throw "Exported certificate subject is '$($exported.Subject)', expected '$expected'"
          }

          Write-Host "Exported $expected"
          Write-Host "  thumbprint: $($exported.Thumbprint)"
          Write-Host "  valid until: $($exported.NotAfter.ToString('yyyy-MM-dd'))"

      - name: Upload sideload certificate artifact
        uses: actions/upload-artifact@v4
        with:
          name: centroidx-sideload.cer
          path: centroid-hmi/centroidx-sideload.cer

      # tag.yml calls this workflow with a ref and has already committed the
      # tag's version into pubspec.yaml — a stable build must not be restamped.
      # PR and workflow_dispatch builds have no ref and are stamped, which is
      # right: an MSIX built from a PR should not claim a release's version
      # either. The leading zero sorts below every stable `2026.x`, so a stable
      # release is always an upgrade from a main build; run_number is monotonic,
      # so main builds order correctly among themselves. Per-build only — never
      # committed back.
      - name: Stamp an unstable package version
        if: inputs.ref == ''
        working-directory: centroid-hmi
        shell: bash
        run: |
          MSIX_VERSION="0.$(date -u +%Y).$(date -u +%-m).${{ github.run_number }}"
          sed -i "s/^  msix_version: .*/  msix_version: $MSIX_VERSION/" pubspec.yaml
          echo "stamped msix_version: $MSIX_VERSION"

      - name: Build MSIX (sideload, signed)
        working-directory: centroid-hmi
        shell: powershell
        # msix:create reruns "flutter build windows" itself, so the GIT_SHA
        # define has to ride along or the packaged exe loses its build stamp —
        # and the CENTROIDX_CHAT/CENTROIDX_KNOWLEDGE=false defines likewise, or the MSIX
        # would ship the features the zip build compiled out.
        run: echo "n" | dart run msix:create --certificate-password "${{ secrets.MSIX_CERT_PASSWORD }}" --windows-build-args "--dart-define=GIT_SHA=${{ env.BUILD_SHA }} --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false"

      - name: Verify MSIX is signed
        working-directory: centroid-hmi
        shell: powershell
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No .msix file found after build" }
          Write-Host "MSIX built: $($msix.FullName) ($([math]::Round($msix.Length/1MB, 1)) MB)"

      - name: Locate MSIX
        working-directory: centroid-hmi
        id: locate
        shell: powershell
        run: |
          $msix = Get-ChildItem -Recurse -Filter *.msix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No .msix file found" }
          "msix=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi.msix
          path: ${{ steps.locate.outputs.msix }}

      # Portable (no-install) build: the Release folder runs directly after
      # unzip. The MSIX declares the VC++ runtime as a package dependency, but
      # a bare exe needs the DLLs next to it — copy them in. Done after the
      # MSIX is packaged so its contents stay unchanged.
      - name: Make Release folder portable (bundle VC++ runtime)
        shell: powershell
        run: |
          $release = "centroid-hmi/build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$dll" $release
          }
          # msix:create drops the package here, so it would otherwise ride
          # along inside the portable zip — 26 MB of installer in a download
          # whose whole point is not being an installer. Already uploaded as
          # its own artifact by this point.
          Remove-Item "$release/*.msix" -Force -ErrorAction SilentlyContinue
          Get-ChildItem $release

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi-windows-portable
          path: centroid-hmi/build/windows/x64/runner/Release/
