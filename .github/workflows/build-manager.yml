name: Build centroidx-manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/centroidx-manager'
      - 'fix/manager-macos-app-bundle'
    paths:
      - 'tools/centroidx-manager/**'
      - '.github/workflows/build-manager.yml'
  pull_request:
    paths:
      - 'tools/centroidx-manager/**'
      - '.github/workflows/build-manager.yml'
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      # The integration tests resolve "the latest release" off the live
      # Releases API and download from it. A caller that is about to *replace*
      # that release must not be gated on them: they describe the state the
      # caller is superseding, and a bad release then blocks the very run that
      # would fix it. main-prerelease.yml passes false for exactly that reason.
      # PRs and pushes still run them, which is where they catch regressions.
      #
      # A string, not a boolean, and compared as one. On push/pull_request
      # there is no `inputs` context, so this reads as ''. GitHub casts both ''
      # and boolean false to 0 when either side of a comparison is a number or
      # boolean, which makes `inputs.x != false` FALSE when unset — a boolean
      # input silently disables the job everywhere instead of only where the
      # caller asked. Two strings compare as strings, so '' != 'false' holds.
      run_integration_tests:
        type: string
        default: 'true'

# One run per ref, so a second push to a PR replaces the run in flight instead
# of stacking another on top of it.
#
# The group key is a hardcoded slug and deliberately does NOT use
# `${{ github.workflow }}`. A called reusable workflow gets no run of its own —
# its jobs join the caller's run and inherit the caller's `github` context — so
# `github.workflow` here would be "Tag Release", the same value the three other
# workflows tag.yml calls in that run would see. A shared group would let one
# of them supersede another, and `create-release` needs this workflow's
# artifacts by name: it would fail on a missing centroidx-manager binary. A
# literal prefix cannot collide however this file is invoked.
#
# Cancelling is limited to pull requests for the same reason. Caller context
# means caller event, and tag.yml is triggered by a tag `push`, so a release
# can never be cancelled by someone's unrelated PR push.
concurrency:
  group: centroidx-manager-build-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: centroidx-manager_windows_amd64.exe
            cgo: '0'
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: centroidx-manager_linux_amd64
            cgo: '1'
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: centroidx-manager
            artifact_name: centroidx-manager_darwin_arm64.dmg
            cgo: '1'
    runs-on: ${{ matrix.os }}
    steps:
      # `actions/checkout` is a network operation against github.com, and it fails
      # outright often enough to matter — 9 times in the 2.5 weeks to 2026-09-10,
      # each one killing a whole job before a single useful step had run. Retried
      # once here, and at every other checkout in this file.
      #
      # This cannot be factored into `.github/actions/` the way pub-get and
      # setup-flutter are: a local composite action is loaded from the workspace,
      # and the workspace does not exist until checkout has run. So the retry is
      # written out at each site instead.
      #
      # Safe to repeat: checkout cleans the workspace on entry, so the second
      # attempt does not inherit a half-finished first one.
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The module cache key is built from go.sum, and setup-go looks
          # for it at the repo root by default — where this repo does not have
          # one. Without this the cache never restores ("Dependencies file is
          # not found"), so every run re-downloads every module from
          # proxy.golang.org. That is slower, and it is a network round trip
          # per module on which the build can and does fail: a `stream error
          # ... INTERNAL_ERROR received from peer` fetching go-text/typesetting
          # is what broke Main Prerelease on 2026-09-02.
          cache-dependency-path: tools/centroidx-manager/go.sum

      - name: Install Linux build dependencies (Gio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libvulkan-dev

      - name: Embed Windows icon resource
        if: matrix.os == 'windows-latest'
        working-directory: tools/centroidx-manager
        shell: bash
        run: |
          windres --use-temp-file -o centroidx.syso centroidx.rc
          echo "Icon resource compiled: $(wc -c < centroidx.syso) bytes"

      - name: Build manager binary
        working-directory: tools/centroidx-manager
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -o "${{ matrix.binary_name || matrix.artifact_name }}" .

      # Same certificate and shape as windows.yml's manager signing step: the
      # exe published as a release asset must name Centroid on the elevation
      # prompt, exactly like the copy bundled inside the app. Gated on the
      # secret the way the Apple signing below is, so a context without
      # secrets (dependabot) still builds - unsigned there, loudly signed
      # everywhere that publishes.
      - name: Sign the manager executable
        if: matrix.os == 'windows-latest' && env.MSIX_CERT_PFX_BASE64 != ''
        working-directory: tools/centroidx-manager
        shell: powershell
        env:
          MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "${{ matrix.binary_name || matrix.artifact_name }}"
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found under Windows Kits" }
          & $signtool.FullName sign /f $pfx /p $env:MSIX_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign exited $LASTEXITCODE" }
          Remove-Item $pfx
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
            throw "manager exe is not signed"
          }
          $subject = "CN=Centroid, O=Centroid ehf., C=IS"
          if ($sig.SignerCertificate.Subject -ne $subject) {
            throw "signed by '$($sig.SignerCertificate.Subject)', expected '$subject'"
          }
          if (-not $sig.TimeStamperCertificate) {
            throw "signature carries no timestamp"
          }
          Write-Host "Signed by $subject, timestamped, status: $($sig.Status)"

      - name: Package macOS .app bundle and DMG
        if: matrix.os == 'macos-latest'
        working-directory: tools/centroidx-manager
        run: |
          APP="CentroidX-Manager.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp centroidx-manager "$APP/Contents/MacOS/centroidx-manager"
          cp Info.plist "$APP/Contents/Info.plist"
          cp icon.icns "$APP/Contents/Resources/icon.icns"
          chmod +x "$APP/Contents/MacOS/centroidx-manager"
          echo "App bundle created:"
          find "$APP" -type f

      - name: Sign and notarize macOS app bundle
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE_P12_BASE64 != ''
        working-directory: tools/centroidx-manager
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          APP="CentroidX-Manager.app"

          # Import certificate into temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Find signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing with: $IDENTITY"

          # Sign the .app bundle with hardened runtime + timestamp
          codesign --force --options runtime --sign "$IDENTITY" --timestamp --deep "$APP"
          codesign --verify --deep --strict "$APP"
          echo "App bundle signing verified"

          # Create DMG. Retries "Resource busy", which `hdiutil create` throws
          # intermittently and which would otherwise cost a whole release —
          # this job is in create-release's `needs`. See the script.
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          "$GITHUB_WORKSPACE/.github/scripts/create-dmg.sh" \
            "CentroidX Manager" dmg-staging "${{ matrix.artifact_name }}"
          rm -rf dmg-staging

          # Sign the DMG
          codesign --force --sign "$IDENTITY" --timestamp "${{ matrix.artifact_name }}"
          echo "DMG signed"

          # Notarize the DMG. Non-fatal, same policy as macos.yml: notarization
          # depends on Apple's service and on the team's licence agreements
          # being current, neither of which a code change can break. The DMG is
          # still Developer ID signed — it just is not stapled, and macOS shows
          # a Gatekeeper prompt on first launch.
          if xcrun notarytool submit "${{ matrix.artifact_name }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait; then
            echo "Notarization complete"
            # Staple the notarization ticket to the DMG
            xcrun stapler staple "${{ matrix.artifact_name }}"
            echo "Stapled notarization ticket"
          else
            echo "::warning title=Notarization failed::${{ matrix.artifact_name }} is signed but NOT notarized or stapled. macOS will warn on first launch. Check the Apple Developer team's agreements and the notary service status."
          fi

          # Cleanup keychain
          security delete-keychain "$KEYCHAIN_PATH"

      - name: Create unsigned DMG (when signing is not available)
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE_P12_BASE64 == ''
        working-directory: tools/centroidx-manager
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        run: |
          APP="CentroidX-Manager.app"
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          # Same retry as the signed path above. See the script.
          "$GITHUB_WORKSPACE/.github/scripts/create-dmg.sh" \
            "CentroidX Manager" dmg-staging "${{ matrix.artifact_name }}"
          rm -rf dmg-staging
          echo "Unsigned DMG created"

      - name: Verify artifact
        working-directory: tools/centroidx-manager
        shell: bash
        run: |
          echo "Built: ${{ matrix.artifact_name }}"
          ls -la ${{ matrix.artifact_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: tools/centroidx-manager/${{ matrix.artifact_name }}

  # The manager's unit tests had never run anywhere. The only `go test` in the
  # whole of .github/workflows was the integration one below, and it is
  # `-tags integration -run TestIntegration` — so 68 plain unit tests across
  # internal/{github,platform,ui,update} compiled and executed on developer
  # machines only, and the three tests behind //go:build windows in
  # internal/platform/extract_windows_test.go had never compiled at all.
  #
  # Deliberately not `needs: [build]`: these are hermetic and take seconds, and
  # there is no reason to queue them behind three platform builds. Nor are they
  # gated on run_integration_tests — that flag exists because the integration
  # tests describe the release a caller is about to replace (see the input's
  # comment above), which is not true of these. A unit-test failure blocking
  # main-prerelease's publish is the correct outcome: it means the manager
  # about to be published is broken.
  #
  # ubuntu and windows, no macOS: the windows leg is what makes
  # extract_windows_test.go compile, ubuntu covers everything else, and macOS
  # runners are the scarce resource on this plan — the integration job below
  # already spends one.
  unit-test:
    name: manager-unit-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cgo: '1'
          - os: windows-latest
            cgo: '0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The module cache key is built from go.sum, and setup-go looks
          # for it at the repo root by default — where this repo does not have
          # one. Without this the cache never restores ("Dependencies file is
          # not found"), so every run re-downloads every module from
          # proxy.golang.org. That is slower, and it is a network round trip
          # per module on which the build can and does fail: a `stream error
          # ... INTERNAL_ERROR received from peer` fetching go-text/typesetting
          # is what broke Main Prerelease on 2026-09-02.
          cache-dependency-path: tools/centroidx-manager/go.sum

      # internal/ui is Gio, so `./...` needs the windowing headers even though
      # no window is ever opened. Same list the build job installs.
      - name: Install Linux build dependencies (Gio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libvulkan-dev

      - name: Run unit tests
        working-directory: tools/centroidx-manager
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          # GitHub's Windows runners run elevated, so TestWritable's premise
          # -- an unelevated process cannot write Program Files -- does not
          # hold here and the test provides this escape hatch for exactly
          # that. The assertion still runs anywhere unelevated.
          CENTROIDX_TEST_ELEVATED: ${{ runner.os == 'Windows' && '1' || '' }}
        run: go test ./...

  integration-test:
    needs: [build]
    # Unset on push/pull_request (no `inputs` context), so the tests run there.
    if: ${{ inputs.run_integration_tests != 'false' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            cgo: '0'
          - os: ubuntu-latest
            goos: linux
            cgo: '1'
          - os: macos-latest
            goos: darwin
            cgo: '1'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The module cache key is built from go.sum, and setup-go looks
          # for it at the repo root by default — where this repo does not have
          # one. Without this the cache never restores ("Dependencies file is
          # not found"), so every run re-downloads every module from
          # proxy.golang.org. That is slower, and it is a network round trip
          # per module on which the build can and does fail: a `stream error
          # ... INTERNAL_ERROR received from peer` fetching go-text/typesetting
          # is what broke Main Prerelease on 2026-09-02.
          cache-dependency-path: tools/centroidx-manager/go.sum

      - name: Install Linux build dependencies (Gio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libvulkan-dev

      - name: Run integration tests
        working-directory: tools/centroidx-manager
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -tags integration -v -timeout 300s ./internal/update/ -run TestIntegration

      - name: Run platform integration tests
        working-directory: tools/centroidx-manager
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test -tags integration -v -timeout 120s ./internal/platform/ -run TestIntegration
