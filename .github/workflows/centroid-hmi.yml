name: Build and Push centroid-hmi Docker Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (commit SHA, branch, tag)'
        type: string
        default: ''
      release:
        description: 'Build in release mode'
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

# Two runs of this workflow on the same PR branch push the same `pr-NNN` tag,
# so let a new push replace the one in flight rather than race it. Only for
# pull requests — a main or tag build must finish and publish.
#
# `elinux-` prefix added on top of #235's block: tag.yml now calls this
# workflow in the same run as macos.yml and windows.yml, and in a called run
# `github.workflow` is the caller's ("Tag Release") for all three. Without a
# per-file prefix they would share one group and queue behind each other. See
# macos.yml for the full reasoning. The cancel guard is unchanged.
concurrency:
  group: elinux-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  elinux-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/centroid-is/tfc-toolchain:latest
    outputs:
      centroid_hmi_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Make safe directory
        run: git config --system --add safe.directory '*'
      # `actions/checkout` is a network operation against github.com, and it fails
      # outright often enough to matter — 9 times in the 2.5 weeks to 2026-09-10,
      # each one killing a whole job before a single useful step had run. Retried
      # once here, and at every other checkout in this file.
      #
      # This cannot be factored into `.github/actions/` the way pub-get and
      # setup-flutter are: a local composite action is loaded from the workspace,
      # and the workspace does not exist until checkout has run. So the retry is
      # written out at each site instead.
      #
      # Safe to repeat: checkout cleans the workspace on entry, so the second
      # attempt does not inherit a half-finished first one.
      - name: Checkout centroid-hmi
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout centroid-hmi (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        working-directory: centroid-hmi
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Trial of upstream flutter-elinux (community org) at the 3.47.0 release,
      # which carries its own native-asset hooks support (85d268b) — the reason
      # our centroid-is fork's `hooks` branch existed. Shadows the toolchain
      # image's baked /flutter-elinux; if this build is green the pin moves into
      # tfc-toolchain and this step goes away.
      - name: Use upstream flutter-elinux 3.47.0
        run: |
          git clone https://github.com/flutter-elinux/flutter-elinux.git /opt/flutter-elinux-347
          git -C /opt/flutter-elinux-347 checkout 4d63880dfaba6e30530b88f2344e0a7b870228b2
          echo "/opt/flutter-elinux-347/bin" >> "$GITHUB_PATH"

      - name: Setup elinux platform
        working-directory: centroid-hmi
        run: flutter-elinux create --platforms=elinux .

      # centroid-hmi/elinux/ is regenerated by the step above on every build,
      # so the one change CEF needs in the runner's main() cannot live in the
      # tree. The script is idempotent and fails loudly if the flutter-elinux
      # template moves. See scripts/patch-elinux-cef-runner.sh.
      - name: Start CEF child processes from the eLinux runner
        run: ./scripts/patch-elinux-cef-runner.sh

      - name: Get Flutter Packages
        uses: ./.github/actions/pub-get
        with:
          command: flutter-elinux pub get
          working-directory: centroid-hmi

      - name: Build for eLinux
        working-directory: centroid-hmi
        # CENTROIDX_CHAT/CENTROIDX_KNOWLEDGE off: the published image excludes the AI chat
        # and knowledge features for now (lib/core/feature_flags.dart). Applied
        # to debug builds too — the PR image is deployed to stations for
        # testing, not used as a dev environment.
        run: flutter-elinux build elinux ${{ inputs.release && '--release' || '--debug' }} --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false

      - name: Move build artifacts
        working-directory: centroid-hmi
        run: |
          mkdir -p assets
          mv build/elinux/x64/${{ inputs.release && 'release' || 'debug' }}/bundle/* assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi-artifacts
          path: centroid-hmi/assets/

  # `docker-build` and `backend-build` are also job ids in centroid-hmi-ivi.yml,
  # so without a `name` both workflows publish identically-named checks on every
  # PR. Job ids are unchanged — `needs:` below refers to them.
  docker-build:
    name: Docker Image (flutter-elinux)
    needs: elinux-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-artifacts
          path: docker/frontend/bundle

      - name: List files in frontend/bundle
        run: ls -l docker/frontend/bundle

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/docker-build-push
        with:
          context: docker/frontend
          build-args: |
            APP_BIN=centroidx
            APP_BUNDLE=bundle
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:${{ needs.elinux-build.outputs.centroid_hmi_sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:latest

      - name: Build and push Docker image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/docker-build-push
        with:
          context: docker/frontend
          build-args: |
            APP_BIN=centroidx
            APP_BUNDLE=bundle
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:${{ needs.elinux-build.outputs.centroid_hmi_sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:stable

      - name: Build and push Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-build-push
        with:
          context: docker/frontend
          build-args: |
            APP_BIN=centroidx
            APP_BUNDLE=bundle
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:pr-${{ github.event.pull_request.number }}

  # `latest` is a debug build (the elinux-build above only builds release when
  # tag.yml calls this workflow, which tags `stable`). This pair rebuilds the
  # same main commit in release mode so `latest-release` always tracks the tip
  # of main as a production-mode image. Skipped on workflow_call with
  # release=true — that run's own image is already a release build.
  elinux-release-build:
    if: github.ref == 'refs/heads/main' && !inputs.release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/centroid-is/tfc-toolchain:latest
    outputs:
      centroid_hmi_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Make safe directory
        run: git config --system --add safe.directory '*'
      - name: Checkout centroid-hmi
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout centroid-hmi (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        working-directory: centroid-hmi
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Trial of upstream flutter-elinux (community org) at the 3.47.0 release,
      # which carries its own native-asset hooks support (85d268b) — the reason
      # our centroid-is fork's `hooks` branch existed. Shadows the toolchain
      # image's baked /flutter-elinux; if this build is green the pin moves into
      # tfc-toolchain and this step goes away.
      - name: Use upstream flutter-elinux 3.47.0
        run: |
          git clone https://github.com/flutter-elinux/flutter-elinux.git /opt/flutter-elinux-347
          git -C /opt/flutter-elinux-347 checkout 4d63880dfaba6e30530b88f2344e0a7b870228b2
          echo "/opt/flutter-elinux-347/bin" >> "$GITHUB_PATH"

      - name: Setup elinux platform
        working-directory: centroid-hmi
        run: flutter-elinux create --platforms=elinux .

      # centroid-hmi/elinux/ is regenerated by the step above on every build,
      # so the one change CEF needs in the runner's main() cannot live in the
      # tree. The script is idempotent and fails loudly if the flutter-elinux
      # template moves. See scripts/patch-elinux-cef-runner.sh.
      - name: Start CEF child processes from the eLinux runner
        run: ./scripts/patch-elinux-cef-runner.sh

      - name: Get Flutter Packages
        uses: ./.github/actions/pub-get
        with:
          command: flutter-elinux pub get
          working-directory: centroid-hmi

      - name: Build for eLinux
        working-directory: centroid-hmi
        # Same CENTROIDX_CHAT/CENTROIDX_KNOWLEDGE opt-out as elinux-build above: every
        # published image excludes the AI chat and knowledge features
        # (lib/core/feature_flags.dart). `latest-release` is what stations
        # pull, so it must not differ from `stable` in what it ships.
        run: flutter-elinux build elinux --release --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false

      - name: Move build artifacts
        working-directory: centroid-hmi
        run: |
          mkdir -p assets
          mv build/elinux/x64/release/bundle/* assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi-artifacts-release
          path: centroid-hmi/assets/

  docker-release-build:
    needs: elinux-release-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-artifacts-release
          path: docker/frontend/bundle

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (main, release)
        uses: ./.github/actions/docker-build-push
        with:
          context: docker/frontend
          build-args: |
            APP_BIN=centroidx
            APP_BUNDLE=bundle
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:${{ needs.elinux-release-build.outputs.centroid_hmi_sha }}-release
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:latest-release

  # A third build of the same main commit, in **profile** mode, published as
  # `latest-profile`. Additive: `latest` (debug) and `latest-release` above are
  # untouched and keep their meaning.
  #
  # Profile is AOT-compiled by the same gen_snapshot with the same
  # optimisations — a station running it feels like release — but the engine
  # keeps three things release strips out: the Dart VM Service, the sampling
  # CPU profiler, and the `Flutter.Frame` timing events the framework posts
  # under `!kReleaseMode`. Without them there is no way to answer "why is this
  # station slow" on the station itself; with them, docker/profiler does it
  # from a terminal. The costs are a larger binary and the profiler's overhead
  # while a profile is actually being taken, which is why this is its own tag
  # and not a change to what stations already pull.
  #
  # `workflow_dispatch` is in the condition so the profile build can be proven
  # on a branch before it is merged. Without it the first run of this job is
  # the one that lands on main, and a mode flag that does not work turns main
  # red rather than a PR. `gh workflow run centroid-hmi.yml --ref <branch>`;
  # docker-profile-build stays main-only, so a dispatched run builds and
  # verifies without publishing `latest-profile` from a branch.
  elinux-profile-build:
    if: >-
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      && !inputs.release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/centroid-is/tfc-toolchain:latest
    outputs:
      centroid_hmi_sha: ${{ steps.get_sha.outputs.sha }}
    steps:
      - name: Make safe directory
        run: git config --system --add safe.directory '*'
      - name: Checkout centroid-hmi
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout centroid-hmi (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        working-directory: centroid-hmi
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Setup elinux platform
        working-directory: centroid-hmi
        run: flutter-elinux create --platforms=elinux .

      # centroid-hmi/elinux/ is regenerated by the step above on every build,
      # so the one change CEF needs in the runner's main() cannot live in the
      # tree. The script is idempotent and fails loudly if the flutter-elinux
      # template moves. See scripts/patch-elinux-cef-runner.sh.
      - name: Start CEF child processes from the eLinux runner
        run: ./scripts/patch-elinux-cef-runner.sh

      - name: Get Flutter Packages
        uses: ./.github/actions/pub-get
        with:
          command: flutter-elinux pub get
          working-directory: centroid-hmi

      - name: Build for eLinux
        working-directory: centroid-hmi
        # Same CENTROIDX_CHAT/CENTROIDX_KNOWLEDGE opt-out as the release build: a profile
        # image is a station image with the VM Service left in, so it has to
        # contain the same features, or a profile taken on a station measures
        # code that `latest-release` never runs.
        run: flutter-elinux build elinux --profile --dart-define=CENTROIDX_CHAT=false --dart-define=CENTROIDX_KNOWLEDGE=false

      - name: Move build artifacts
        working-directory: centroid-hmi
        run: |
          mkdir -p assets
          mv build/elinux/x64/profile/bundle/* assets/

      # A profile bundle that quietly came out as release would publish an
      # image nothing can attach to, and the failure would only surface as a
      # refused connection on a station weeks later.
      #
      # The marker is the VM Service RPC table: `getCpuSamples` is a string in
      # a profile engine and absent from a release one, because release
      # compiles the whole service protocol out. Measured on the 3.44.9
      # artifacts — 2 hits in profile, 0 in release. `grep -a` rather than
      # `strings`, so this does not depend on binutils being in the toolchain
      # image.
      - name: Verify the engine really is a profile build
        working-directory: centroid-hmi
        run: |
          engine=assets/lib/libflutter_engine.so
          test -f "$engine" || { echo "::error::no $engine in the bundle"; exit 1; }
          if ! grep -a -q getCpuSamples "$engine"; then
            echo "::error::$engine has no VM Service — this is a release engine, not a profile one"
            exit 1
          fi
          echo "libflutter_engine.so carries the VM Service; profile build confirmed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centroid-hmi-artifacts-profile
          path: centroid-hmi/assets/

  docker-profile-build:
    needs: elinux-profile-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-artifacts-profile
          path: docker/frontend/bundle

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (main, profile)
        uses: ./.github/actions/docker-build-push
        with:
          context: docker/frontend
          build-args: |
            APP_BIN=centroidx
            APP_BUNDLE=bundle
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:${{ needs.elinux-profile-build.outputs.centroid_hmi_sha }}-profile
            ghcr.io/${{ github.repository_owner }}/centroid-hmi:latest-profile

  backend-build:
    name: Backend Image (flutter-elinux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend Docker image (main)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-backend:latest

      - name: Build and push backend Docker image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/centroid-backend:stable

      - name: Build and push backend Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/backend/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/centroid-backend:pr-${{ github.event.pull_request.number }}

  # The image that reads the VM Service the profile build exposes. It is a
  # python:alpine plus one stdlib-only script, so it is cheap enough to build
  # on every PR — and building it on PRs is what stops `docker/profiler` from
  # rotting silently, since nothing else compiles it.
  profiler-build:
    name: Profiler Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Checkout repository (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get commit SHA
        id: get_sha
        run: |
          SHA=$(git rev-parse --short HEAD) || exit 1
          test -n "$SHA" || (echo "Empty SHA"; exit 1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push profiler image (main)
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/profiler/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/hmi-profiler:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/hmi-profiler:latest

      - name: Build and push profiler image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/profiler/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/hmi-profiler:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/hmi-profiler:stable

      - name: Build and push profiler image (PR)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: docker/profiler/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/hmi-profiler:pr-${{ github.event.pull_request.number }}
