name: Tag Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
      # Rolling tag republished by main-prerelease.yml — not a version tag.
      - '!main-latest'

permissions:
  contents: write
  packages: write

# Two tags pushed close together would otherwise run concurrently, and both
# would try to push a version bump to main: the second loses the race and dies
# on a non-fast-forward after a full macOS and Windows build has already been
# paid for. Queued instead — and never cancelled, because the run holds the
# only copy of the release artifacts.
concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  retag-pubspec:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    container:
      image: ghcr.io/centroid-is/tfc-toolchain:latest
    steps:
      - name: Make safe directory
        run: git config --system --add safe.directory '*'
      # `actions/checkout` is a network operation against github.com, and it fails
      # outright often enough to matter — 9 times in the 2.5 weeks to 2026-09-10,
      # each one killing a whole job before a single useful step had run. Retried
      # once here, and at every other checkout in this file.
      #
      # This cannot be factored into `.github/actions/` the way pub-get and
      # setup-flutter are: a local composite action is loaded from the workspace,
      # and the workspace does not exist until checkout has run. So the retry is
      # written out at each site instead.
      #
      # Safe to repeat: checkout cleans the workspace on entry, so the second
      # attempt does not inherit a half-finished first one.
      - name: Checkout centroid-hmi
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true

      - name: Checkout centroid-hmi (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Update version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Updating version to $TAG"

          # Extract version (remove 'v' prefix if present)
          VERSION=${TAG#v}

          # Convert tag to version format (e.g., 2025.11.8)
          # and extract build number if present (format: 2025.11.8+1)
          if [[ $VERSION == *"+"* ]]; then
            FLUTTER_VERSION=$VERSION
            BASE_VERSION=${VERSION%+*}
            BUILD_NUMBER=${VERSION#*+}
          else
            FLUTTER_VERSION="${VERSION}+1"
            BASE_VERSION=$VERSION
            BUILD_NUMBER=1
          fi

          # Update Flutter version
          sed -i "s/^version: .*/version: $FLUTTER_VERSION/" centroid-hmi/pubspec.yaml

          # Update Windows msix_version (format: 2025.11.8.0)
          MSIX_VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          sed -i "s/^  msix_version: .*/  msix_version: $MSIX_VERSION/" centroid-hmi/pubspec.yaml

          echo "Updated versions:"
          echo "  Flutter version: $FLUTTER_VERSION"
          echo "  Windows msix_version: $MSIX_VERSION"

      - name: Commit and push version changes
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add centroid-hmi/pubspec.yaml
          git commit -m "Update version to ${GITHUB_REF#refs/tags/}"
          git push origin HEAD:main
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [retag-pubspec]
    uses: ./.github/workflows/centroid-hmi.yml
    with:
      ref: ${{ needs.retag-pubspec.outputs.ref }}
      release: true
    secrets: inherit

  windows-build:
    needs: [retag-pubspec]
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ needs.retag-pubspec.outputs.ref }}
    secrets: inherit

  macos-build:
    needs: [retag-pubspec]
    uses: ./.github/workflows/macos.yml
    with:
      ref: ${{ needs.retag-pubspec.outputs.ref }}
    secrets: inherit

  build-manager:
    needs: [retag-pubspec]
    uses: ./.github/workflows/build-manager.yml
    with:
      ref: ${{ needs.retag-pubspec.outputs.ref }}
    secrets: inherit

  create-release:
    needs: [retag-pubspec, build-manager, windows-build, macos-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      # Fetched again on its own so the portable build keeps its directory
      # structure — the step above flattens every artifact into one folder,
      # which is fine for the single-file assets but would lose the layout the
      # zip needs.
      - name: Download Windows portable build
        uses: actions/download-artifact@v4
        with:
          name: centroid-hmi-windows-portable
          path: centroidx-windows-x64/

      # The MSIX is the only Windows asset stable has ever shipped, so a
      # machine whose policy refuses to sideload it has no way to run a
      # release build. main-latest has published this zip since #271; stable
      # now does too. Zipped with a top-level directory so it does not explode
      # into the user's Downloads folder.
      - name: Zip Windows portable build
        run: zip -qr release-artifacts/centroidx_windows_x64.zip centroidx-windows-x64

      - name: Generate SHA256SUMS.txt
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Canonical asset name the manager looks for (msix:create emits
          # centroidx.msix; the manager still accepts the old name when
          # rolling back to releases published before this rename).
          #
          # Asserted rather than looped: with no match the old loop ran once on
          # the literal string "*.msix" and failed confusingly, and with more
          # than one it renamed them all onto the same target and silently
          # published whichever landed last.
          msix=(*.msix)
          if [ "${#msix[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .msix artifact, found ${#msix[@]}: ${msix[*]:-none}"
            exit 1
          fi
          [ "${msix[0]}" = "centroidx_windows_amd64.msix" ] \
            || mv "${msix[0]}" centroidx_windows_amd64.msix

          # The sideload certificate arrives through the flat download above —
          # windows.yml uploads it and windows-build is in `needs`, so it is
          # already present. Named here rather than globbed, like every other
          # asset: if the export step ever stops producing it, this line fails
          # the release instead of quietly publishing a release that no fresh
          # Windows machine can install.
          echo "Artifacts to checksum:"
          ls -la
          sha256sum centroidx-manager_* \
                    centroidx_darwin_arm64.dmg \
                    centroidx_windows_x64.zip \
                    centroidx_windows_amd64.msix \
                    centroidx-sideload.cer > SHA256SUMS.txt
          echo ""
          echo "SHA256SUMS.txt contents:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/centroidx-manager_*
            release-artifacts/centroidx_darwin_arm64.dmg
            release-artifacts/centroidx_windows_x64.zip
            release-artifacts/SHA256SUMS.txt
            release-artifacts/centroidx_windows_amd64.msix
            release-artifacts/centroidx-sideload.cer
