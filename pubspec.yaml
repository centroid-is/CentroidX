name: tfc
description: "Time For Change(TFC) display framework."
version: 2025.2.0
homepage:

environment:
  sdk: ^3.5.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  beamer: ^1.6.2
  clock: ^1.1.1
  flutter_svg: ^2.0.10
  logger: ^2.4.0
  nm: ^0.5.0
  dbus: ^0.7.11
  dartssh2: ^2.11.0
  shared_preferences: ^2.3.5
  file_picker: ^10.3.3
  rxdart: ^0.28.0
  font_awesome_flutter: ^11.0.0
  riverpod: ^2.6.1
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  flutter_riverpod: ^2.6.1
  flutter_colorpicker: ^1.1.0
  open62541: ^1.5.7+3
  postgres: ^3.4.5
  intl: ^0.20.2
  crypto: ^3.0.0
  collection: ^1.18.0
  community_charts_flutter: ^1.0.4
  meta: ^1.15.0
  drift: ^2.28.0
  drift_postgres: ^1.3.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  # Declared, not transitive: `lib/core/device_local_store.dart` constructs
  # these two platform classes directly rather than going through
  # `package:path_provider`, because that is what `shared_preferences_linux`
  # and `shared_preferences_windows` do themselves — and because
  # flutter-elinux only registers plugins declaring an `elinux:` platform key,
  # which neither of them does. Both were already resolved transitively; this
  # changes no version, it makes the import legal.
  path_provider_linux: ^2.2.2
  path_provider_windows: ^2.3.0
  path: ^1.9.0
  basic_utils: ^5.7.0
  amplify_secure_storage_dart: ^0.5.6
  cryptography_flutter: ^2.3.2
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.0.0
  board_datetime_picker:
    git:
      url: https://github.com/centroid-is/board_datetime_picker.git
      # Head of `subtitle-for-start-end-date` as of 2026-08-23 (last moved
      # 2025-11-03). See the note on open62541 above for why this is a SHA.
      ref: efc20ef16ace8ce37442d06732182ff06d05c398
  cristalyse:
    git:
      url: https://github.com/centroid-is/cristalyse.git
      # Head of `dev` as of 2026-08-23 (last moved 2026-02-16). NOTE: work on
      # cristalyse was in progress elsewhere when this was pinned; if that fix
      # is meant to ship, push it and bump this SHA deliberately.
      ref: c9afc9db1032dc1f14096c703f11a0a3bc90c40b
  tfc_dart:
    path: packages/tfc_dart
  tfc_mcp_server:
    path: packages/tfc_mcp_server
  jbtm:
    path: packages/jbtm
  # Pure Dart: groups, roles, sessions and the audit contract. It depends on
  # nothing in this repo, which is what keeps open62541 and native assets out
  # of the relay server and a later web client.
  tfc_access:
    path: packages/tfc_access
  # Pinned: newer mcp_dart (2.4.0 observed, 2026-08) removes server-initiated
  # elicitation ("elicitation/create is a legacy server-initiated
  # interaction"), which ElicitationRiskGate depends on. Migrate to stateless
  # elicitation before unpinning.
  mcp_dart: 2.0.0
  anthropic_sdk_dart: ^1.2.0
  openai_dart: ^1.1.0
  pdfrx: ^2.2.24
  pasteboard: ^0.5.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # Endorses webview_flutter_wkwebview on macOS; there is no Linux, eLinux or
  # Windows implementation, which is why WebViewAssetConfig renders a
  # placeholder rather than a browser everywhere else. See the class doc.
  webview_flutter: ^4.14.1
  # CEF for the Linux desktop build and the eLinux stations, where no OS
  # browser exists. Vendored rather than depended on: upstream ships one
  # package declaring macos/windows/linux/elinux, and Flutter registers a
  # plugin on every platform its own pubspec names — depending on it would
  # download and compile ~600 MB of CEF into the macOS and Windows builds,
  # which already have WKWebView and WebView2. See packages/webview_cef/README.
  webview_cef:
    path: packages/webview_cef
  # Windows web view: WebView2, the OS-provided engine, reached through the
  # federated implementation package *directly* rather than the
  # flutter_inappwebview umbrella. The umbrella endorses android/ios/macos/web
  # too, so depending on it would add native plugins to every platform's build;
  # this package declares `windows` alone and is invisible to the others. See
  # the macOS build-time note in #487.
  flutter_inappwebview_windows: ^0.6.0
  flutter_inappwebview_platform_interface: ^1.3.0
dev_dependencies:
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/centroid.svg
  fonts:
    - family: TfcIcons
      fonts:
        - asset: assets/fonts/TfcIcons.ttf
  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package




dependency_overrides:
