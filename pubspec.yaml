name: tfc
description: "Time For Change(TFC) display framework."
version: 2025.2.0
homepage:

environment:
  sdk: ^3.5.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  beamer: ^1.6.2
  clock: ^1.1.1
  flutter_svg: ^2.0.10
  logger: ^2.4.0
  nm: ^0.5.0
  dbus: ^0.7.11
  dartssh2: ^2.11.0
  shared_preferences: ^2.3.5
  file_picker: ^10.3.3
  rxdart: ^0.28.0
  font_awesome_flutter: ^11.0.0
  riverpod: ^2.6.1
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  flutter_riverpod: ^2.6.1
  flutter_colorpicker: ^1.1.0
  open62541: ^1.5.7+3
  postgres: ^3.4.5
  http: ^1.6.0
  intl: ^0.20.2
  collection: ^1.18.0
  community_charts_flutter: ^1.0.4
  meta: ^1.15.0
  drift: ^2.28.0
  drift_postgres: ^1.3.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
