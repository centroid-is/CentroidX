  basic_utils: ^5.7.0
  amplify_secure_storage_dart: ^0.5.6
  cryptography_flutter: ^2.3.2
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.0.0
  board_datetime_picker:
    git:
      url: https://github.com/centroid-is/board_datetime_picker.git
      # Head of `subtitle-for-start-end-date` as of 2026-08-23 (last moved
      # 2025-11-03). See the note on open62541 above for why this is a SHA.
      ref: efc20ef16ace8ce37442d06732182ff06d05c398
  cristalyse:
    git:
      url: https://github.com/centroid-is/cristalyse.git
      # Head of `dev` as of 2026-08-23 (last moved 2026-02-16). NOTE: work on
      # cristalyse was in progress elsewhere when this was pinned; if that fix
      # is meant to ship, push it and bump this SHA deliberately.
      ref: c9afc9db1032dc1f14096c703f11a0a3bc90c40b
  tfc_dart:
    path: packages/tfc_dart
  tfc_mcp_server:
    path: packages/tfc_mcp_server
  jbtm:
    path: packages/jbtm
  # Pinned: newer mcp_dart (2.4.0 observed, 2026-08) removes server-initiated
  # elicitation ("elicitation/create is a legacy server-initiated
  # interaction"), which ElicitationRiskGate depends on. Migrate to stateless
  # elicitation before unpinning.
  mcp_dart: 2.0.0
  anthropic_sdk_dart: ^1.2.0
  openai_dart: ^1.1.0
  pdfrx: ^2.2.24
  desktop_drop: ^0.7.0
  pasteboard: ^0.5.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
dev_dependencies:
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.28.0

