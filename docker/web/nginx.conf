server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Beamer routes are real paths (`/alarm-view`, `/advanced/server-config`),
    # so a reload or a bookmark asks nginx for a file that does not exist. The
    # app is one page; hand every unknown path to it and let the router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The three files that decide which build runs. `index.html` also carries
    # the gateway declaration, which changes with the environment rather than
    # with the bundle, so a cached copy would keep a browser dialling the
    # address it was handed a month ago.
    location = /index.html            { add_header Cache-Control "no-store"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-store"; }
    location = /version.json          { add_header Cache-Control "no-store"; }

    # Everything else is content-addressed by the build: a new bundle is a new
    # `main.dart.js`, and the service worker revalidates through
    # `flutter_bootstrap.js` above.
    location ~* \.(js|wasm|json|png|svg|otf|ttf|woff2?|symbols)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/html application/javascript application/json image/svg+xml font/ttf font/otf;
    # The bundle's biggest file is 7 MB of dart2js; below the default 20-byte
    # floor there is nothing worth compressing on a plant LAN.
    gzip_min_length 1024;
}
