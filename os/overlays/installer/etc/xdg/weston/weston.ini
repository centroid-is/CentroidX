# Compositor for the installer only. The station's own weston lives in a
# container with its own weston.ini; this one exists so the setup app has a
# Wayland display and an on-screen keyboard before any disk has been touched.
[core]
# A comma list, not a typo: weston(1) takes "backend1,backend2" and "the first
# backend is the primary backend, and it provides the renderer". So drm keeps
# the panel and the GL renderer, and vnc rides along as a secondary head that
# centroidx-gui-launch points at the panel with [output] mirror-of=. The
# mirror stanza is appended at boot, not written here, because it needs the
# literal DRM connector name.
#
# Not screen-share.so, which upstream weston 14 has but Debian does not build
# (verified with dpkg -L against the trixie package). mirror-of is its
# replacement and is what the station's weston 16 already uses.
backend=drm,vnc
shell=desktop-shell.so
# No keyboard is attached to most panels, which is the whole reason this app
# exists -- weston must not refuse to start for the lack of one.
require-input=false
idle-time=0
renderer=gl

[shell]
background-color=0xff002b36
background-image=none
panel-position=none
locking=false
animation=none
startup-animation=none
allow-zap=false

# A physical keyboard, if one is plugged in, gets the same three layouts the
# station offers, in the same order and with the same switch. The station side
# resolves these lines from KEYBOARD_* at start-up (the weston wrapper in
# centroid-is/dockers); the installer has nothing to resolve them from, so they
# are written out.
#
# NOTE: this is stock trixie weston 14, which does NOT carry the dockers patch
# (0006) fixing the VNC seat's keymap. That patch exists because weston's VNC
# seat came up with no keymap on the station -- see the numpad-over-VNC bug. If
# typing over the remote view misbehaves in a way typing at the panel does not,
# that patch is the first thing to look at.
[keyboard]
keymap_layout=is,us,pl
keymap_options=grp:alt_shift_toggle

# The Gboard-style fork from centroid-is/dockers. It speaks input-method-v1,
# the only input-method protocol weston implements, and reaches the app through
# text-input-v1 -- which is why this is a Flutter client and not a terminal.
# It learns its languages from KEYBOARD_LAYOUTS in weston's environment, set in
# centroidx-gui.service.
[input-method]
path=/usr/local/bin/centroidx-keyboard

# weston starts the app itself and exits when it exits. watch=true is what makes
# a crashed app take weston down with it, so centroidx-gui.service fails and its
# OnFailure hands over to the text installer rather than leaving a blank screen.
[autolaunch]
path=/usr/local/bin/centroidx-setup
watch=true
