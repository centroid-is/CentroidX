# NOTE: `name` is load-bearing beyond Dart. The msix builder uses it as the
# AppxManifest Application Id (with underscores stripped), and centroidx-manager
# hard-codes that id in the shell:AppsFolder URI it uses to relaunch the app
# after an update — see windowsAppID in
# tools/centroidx-manager/internal/platform/installer.go. Renaming this package
# without updating that constant makes an update appear to succeed while the
# HMI never comes back.
name: centroidx
description: "Centroid HMI system for your wildest dreams."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Format: YYYY.MM.DD+1, +1 is the build number that day
version: 2026.8.23+1

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.3
  open62541: ^1.5.7+3
  tfc:
    path: ../
  flutter_riverpod: ^2.6.1
  beamer: ^1.7.0
  shared_preferences: ^2.5.3
  json_annotation: ^4.9.0
  rxdart: ^0.28.0
  amplify_secure_storage_dart: ^0.5.6
  upgrader: ^11.5.1
  http: ^1.6.0
  path_provider: ^2.1.5
  centroidx_upgrader:
    path: ../packages/centroidx_upgrader
  # Video output for package:media_kit on the flutter-elinux stations, where
  # upstream's GTK plugin cannot be registered. No Dart API — depending on it
  # is what puts the native half into the eLinux build.
  media_kit_video_elinux:
    path: ../packages/media_kit_video_elinux
  marionette_flutter: ^0.4.0

dev_dependencies:
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  msix: ^3.16.12


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

assets:
  - assets/icon.png
  - assets/manager/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_white_bg.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  linux:
    generate: true
    image_path: "assets/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png
  ios: true
  android: true

dependency_overrides:
  # tfc:
  #   git:
  #     url: https://github.com/centroid-is/tfc-hmi.git
  #     ref: main
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Head of `fix-orphaned-socket-on-failed-connect` as of 2026-08-23. This
      # branch moved on 2026-08-22, so it was the live one of the four.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581
  open62541:
    git:
      url: https://github.com/centroid-is/open62541_dart.git
      # `monitor-quality-sourcetime`: 1.5.7+3 (main) plus DynamicValue
      # .statusCode / .sourceTimestamp and opt-in `deliverBadStatus`. Keep in
      # step with the root pubspec.yaml; every open62541 override in this
      # repo carries this same SHA.
      ref: 91a497a2f1b2e5c7232c9e229de9a9d67c353edb
  # drift:
  #   path: ../../drift/drift
  # drift_postgres:
  #   path: ../../drift/extras/drift_postgres
  # drift_flutter:
  #   path: ../../drift/drift_flutter


msix_config:
  msix_version: 2026.8.23.1
  display_name: CentroidX
  description: 'Industrial HMI application, monitors and controls automated processing lines. Connects to OPC UA servers and PostgreSQL databases, gathers data and displays it in a user-friendly way.'
  # Must equal the signing certificate subject exactly, byte for byte: the
  # MSIX publisher IS the certificate subject. It is also what Windows reads
  # out on an approval prompt, which is why it is a name and no longer a GUID.
  # Changing it changes the package identity -- see scripts/generate-signing-cert.ps1.
  publisher: CN=Centroid, O=Centroid ehf., C=IS
  publisher_display_name: Centroid
  logo_path: assets/icon.png
  identity_name: Centroid.CentroidX
  architecture: x64
  capabilities: "internetClient,privateNetworkClientServer"
  store: false
  certificate_path: centroidx-sideload.pfx
  certificate_password: PLACEHOLDER_SET_IN_CI
