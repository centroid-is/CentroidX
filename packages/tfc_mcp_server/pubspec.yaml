name: tfc_mcp_server
description: MCP server for TFC HMI AI copilot
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.1

dependencies:
  archive: ^4.0.0
  xml: ^6.5.0
  # Pinned: newer mcp_dart (2.4.0 observed, 2026-08) removes server-initiated
  # elicitation ("elicitation/create is a legacy server-initiated
  # interaction"), which ElicitationRiskGate depends on. Migrate to stateless
  # elicitation before unpinning.
  mcp_dart: 2.0.0
  drift: ^2.28.0
  drift_postgres: ^1.3.1
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581
  logger: ^2.4.0
  json_annotation: ^4.9.0
  args: ^2.4.2
  tfc_dart:
    path: ../tfc_dart
  # Already in this package's graph transitively (tfc_dart -> tfc_access);
  # named here because `access_template_service.dart` and
  # `access_template_tools.dart` import it directly, and
  # `depend_on_referenced_packages` is right to object to reaching through
  # tfc_dart for it. Workspace-local and pure Dart -- no registry install, and
  # the one-way rule tfc_access's own pubspec states is unaffected: this is
  # another package depending *on* it.
  tfc_access:
    path: ../tfc_access
  rxdart: ^0.28.0
  uuid: ^4.5.1
  petitparser: ^7.0.0

dependency_overrides:
  # The panel leaks 72-122 MiB/h and is OOM-killed on a station capped at
  # 1 GiB. Measured: a monitored item the server refuses -- which a key with a
  # renamed tag is, forever, on the retry ladder -- leaked its native callback
  # and the value map it captures on every rebuild, and `write()` closed its
  # callback only on the success path. Fixed in open62541_dart#119.
  #
  # **The big one is the serializer.** `OpcUaDynamicValueSerializer.deserialize`
  # calloc'd a 48-byte UA_ExtensionObject header for every struct-valued
  # variant and never freed it -- per struct notification, per read, and per
  # element of an array of structs. A station taking 380-393 notifications a
  # second leaks ~1.07M of those an hour, ~70 MB/h before glibc arena
  # fragmentation, which is the 97-110 MiB/h measured on a panel that is
  # OOM-killed every six to nine hours. `serialize` had the same pattern.
  # open62541_dart#121; found with a tcmalloc heap profile and confirmed
  # independently from the notification rate.
  #
  # Pinned by SHA rather than by branch, the way the other overrides in this
  # repository are: `pubspec.lock` is gitignored, so a branch ref lets a tagged
  # build pick up untested code. Head of `dev-leakfixes`, which is #119 and
  # #121 merged over main -- both fixes in one ref so a station takes one
  # rebuild rather than two.
  # This whole block goes when the fix is released to pub.dev and the
  # `open62541: ^1.5.7+3` constraint above can name that version instead.
  open62541:
    git:
      url: https://github.com/centroid-is/open62541_dart.git
      ref: 19b40be99f433bc9dca8bdcbed25999a6e39536a
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581
  archive: 4.0.2

dev_dependencies:
  lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  drift_dev: ^2.28.0
  test: ^1.25.0
