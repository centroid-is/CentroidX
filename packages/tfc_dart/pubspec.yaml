name: tfc_dart
description: Core functionality and converters for TFC (Time For Change) display framework
version: 1.0.0
publish_to: none

environment:
  # Bumped from ^3.5.1 to match tfc_relay_protocol's floor (below): the protocol
  # package requires ^3.6.0 (digit separators), and a dependency's floor is a
  # floor on ours. The repo runs Dart 3.11.5.
  sdk: ^3.6.0

dependencies:
  # JSON serialization
  json_annotation: ^4.9.0

  # State management and reactive programming
  rxdart: ^0.28.0

  # Logging
  logger: ^2.4.0

  # Database
  drift: ^2.28.0
  drift_postgres: ^1.3.1
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581

  # Secure storage
  amplify_secure_storage_dart: ^0.5.6

  # OPC UA
  open62541: ^1.5.7+3

  # JBTM (M2400 device protocol types)
  jbtm:
    path: ../jbtm

  # Modbus TCP client (local fork with frame parsing + keepalive fixes)
  modbus_client_tcp:
    path: ../modbus_client_tcp

  # Access vocabulary (groups, roles, audit contract). One-way edge:
  # tfc_dart -> tfc_access, never the reverse — tfc_access must stay pure Dart
  # so the relay server does not inherit open62541 and native assets.
  tfc_access:
    path: ../tfc_access

  # The pure-Dart value vocabulary the acquisition pipe speaks. One-way edge:
  # tfc_dart -> tfc_relay_protocol (the protocol package has ZERO runtime deps,
  # so it cannot cycle). This is the pipe's boundary vocabulary: the C-coupled
  # open62541 DynamicValue stops at the worker edge and everything crossing the
  # port is a protocol type.
  tfc_relay_protocol:
    path: ../tfc_relay_protocol

  # Utilities
  collection: ^1.18.0
  path: ^1.9.1
  args: ^2.4.2
  basic_utils: ^5.7.0

dependency_overrides:
  open62541:
    git:
      url: https://github.com/centroid-is/open62541_dart.git
      # `monitor-quality-sourcetime`: 1.5.7+3 (main) plus DynamicValue
      # .statusCode / .sourceTimestamp and opt-in `deliverBadStatus` —
      # PIPE-11's source timestamps. Keep in step with the root
      # pubspec.yaml; every open62541 override in this repo carries this
      # same SHA.
      ref: 0251aa099d1779c2ab0c4f408123d63c8b6c0e12
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581
  archive: 4.0.2 # TODO remove, 4.0.7 made clashes with pointycastle and or basic_utils

dev_dependencies:
  lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  drift_dev: ^2.28.0
  test: ^1.25.0
