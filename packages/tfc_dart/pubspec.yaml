name: tfc_dart
description: Core functionality and converters for TFC (Time For Change) display framework
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.1

dependencies:
  # JSON serialization
  json_annotation: ^4.9.0

  # State management and reactive programming
  rxdart: ^0.28.0

  # Logging
  logger: ^2.4.0

  # Database
  drift: ^2.28.0
  drift_postgres: ^1.3.1
  # Transitive through drift, declared here on purpose. The app resolves
  # sqlite3 2.x — `drift_flutter` (root pubspec.yaml) constrains it to
  # `^2.4.6` — and sqlite3 3.0.0 removed `package:sqlite3/open.dart` and the
  # whole `DynamicLibrary` loading path in favour of build hooks. That path is
  # what `core/sqlite_loader.dart` overrides so the eLinux stations can open
  # the database at all. Without this line tfc_dart floats ahead to 3.x on its
  # own and its tests stop compiling against the sqlite3 the stations run.
  sqlite3: ^2.9.0
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581

  # Secure storage
  amplify_secure_storage_dart: ^0.5.6

  # OPC UA
  open62541: ^1.5.7+3

  # JBTM (M2400 device protocol types)
  jbtm:
    path: ../jbtm

  # Modbus TCP client (local fork with frame parsing + keepalive fixes)
  modbus_client_tcp:
    path: ../modbus_client_tcp

  # Access vocabulary (groups, roles, audit contract). One-way edge:
  # tfc_dart -> tfc_access, never the reverse — tfc_access must stay pure Dart
  # so the relay server does not inherit open62541 and native assets.
  tfc_access:
    path: ../tfc_access

  # Utilities
  collection: ^1.18.0
  path: ^1.9.1
  args: ^2.4.2
  basic_utils: ^5.7.0

dependency_overrides:
  open62541:
    git:
      url: https://github.com/centroid-is/open62541_dart.git
      # `web-types`: 1.5.7+3 plus two things a web build cannot do without.
      #
      # The NodeId split that gives the package an FFI-free
      # `open62541_types.dart`: `DynamicValue` used to reach `dart:ffi`
      # through node_id.dart, which is a hard compile error under dart2js.
      # Import `open62541_types.dart` for values, `open62541.dart` only where
      # a real OPC UA client is used.
      #
      # And the build hook skipping the native build when no code assets were
      # asked for. Measured on main (2026-09-17): `flutter build web` dies in
      # `_buildMbedTLS` with "Null check operator used on a null value" out of
      # `CodeConfig._fromJson`, because a web target requests no code assets
      # and the hook read the config anyway. Nothing in this repository can
      # build for the web until this SHA.
      #
      # Pinned to a SHA, not a branch. Every open62541 override in this repo
      # carries THIS SHA — two packages in one process resolving two different
      # open62541 builds is not a state this repository should be in.
      ref: 91a497a2f1b2e5c7232c9e229de9a9d67c353edb
  postgres:
    git:
      url: https://github.com/centroid-is/postgresql-dart.git
      # Pinned, not a branch: pubspec.lock is gitignored, so a branch ref
      # lets a tagged build pick up untested code. Head of `fix-orphaned-socket-on-failed-connect`
      # as of 2026-08-23. Keep in step with the root pubspec.yaml.
      ref: 519312712bacca6c54f296ce190bdb85f37a2581
  archive: 4.0.2 # TODO remove, 4.0.7 made clashes with pointycastle and or basic_utils

dev_dependencies:
  lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  drift_dev: ^2.28.0
  test: ^1.25.0
  # Virtual clock for timer-driven tests. Lets the poll-loop cadence tests
  # assert exact tick counts instead of sleeping and hoping (see
  # test/umas_monitor_poll_loop_test.dart).
  fake_async: ^1.3.1
