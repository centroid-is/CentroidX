# Run test files sequentially so integration tests that share
# Docker Compose services don't race each other.
concurrency: 1

# Declaring tags here is what makes `--tags` / `--exclude-tags` usable without
# the "unknown tag" warning package:test prints for undeclared tags. The lesson
# is `tfc_relay_local/dart_test.yaml`'s: an undeclared tag does not select, it
# warns — so `--exclude-tags db` on a package that never declared `db` runs
# every database leg and looks like it excluded them.
tags:
  contract:
    # The shared StateManApi contract suite from tfc_stateman_contract, run
    # against `BackendStateMan` — the backend's own adapter. Two legs carry it:
    # test/core/relay/backend_contract_test.dart in memory, and
    # test/integration/backend_contract_db_test.dart with a real TimescaleDB
    # behind the data services.
  db:
    # Legs that need a REAL TimescaleDB, brought up by
    # test/integration/docker_compose.dart (or by TIMESCALEDB_EXTERNAL=1
    # against a natively provisioned server). The offline lane must stay
    # offline: `dart test --exclude-tags db` must not touch Postgres.
  e2e:
    # End-to-end legs against external hardware or a long-running rig.
